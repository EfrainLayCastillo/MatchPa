services:
  postgres:
    image: postgres:17-alpine
    container_name: matchpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matchpa
      POSTGRES_PASSWORD: matchpa
      POSTGRES_DB: matchpa
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchpa -d matchpa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
