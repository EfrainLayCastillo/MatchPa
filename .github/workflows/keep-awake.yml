name: Keep backend awake

# Render Free sleeps after 15 min without traffic, so the backend is pinged all day.
# The database is kept warm only at peak hours by backend/start/db_warmer.ts (backend/app/services/peak_hours.ts).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 https://matchpa.app/api/health
