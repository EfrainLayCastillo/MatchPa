name: Keep backend awake

# Peak hours in Panama (UTC-5): Mon–Fri 17:00–23:00, Sat–Sun 07:00–23:00.
# Keep in sync with backend/app/services/peak_hours.ts.
on:
  schedule:
    - cron: '*/10 22-23 * * 1-5'
    - cron: '*/10 12-23 * * 0,6'
    - cron: '*/10 0-3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 https://matchpa.app/api/health
