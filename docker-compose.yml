services:
  postgres:
    image: postgres:17-alpine
    container_name: matchpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matchpa
      POSTGRES_PASSWORD: matchpa
      POSTGRES_DB: matchpa
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchpa -d matchpa"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: matchpa-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  voicebox:
    profiles: ["marketing"]
    build: https://github.com/jamiepine/voicebox.git#main
    container_name: matchpa-voicebox
    restart: unless-stopped
    ports:
      - "127.0.0.1:17600:17493"
    environment:
      LOG_LEVEL: info
      NUMBA_CACHE_DIR: /tmp/numba_cache
    volumes:
      - voicebox-data:/app/data
      - voicebox-models:/home/voicebox/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 10G

volumes:
  postgres-data:
  voicebox-data:
  voicebox-models:
